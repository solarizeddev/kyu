<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyu sketch: Question (light)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:#eff0f1}</style>
</head>
<body>
<div style="width: 420px; height: 640px; box-sizing: border-box; padding: 28px; background: #eff0f1; font-family: 'Noto Sans', sans-serif; font-size: 15px; color: #232629; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #5d6368">
<span>Updates</span><span>Paused, nothing changed yet</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">One question first</h1>
<span style="color: #5d6368">Several packages can provide the graphics driver. Pick one.</span>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Provider for vulkan-driver</legend>
<label style="min-height: 60px; padding: 0 16px; border-radius: 12px; background: #ffffff; box-shadow: inset 0 0 0 2px #3daee9; display: flex; align-items: center; gap: 12px">
<input type="radio" name="p" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3daee9">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 500 14px 'Noto Sans Mono', monospace">vulkan-radeon</span><span style="font-size: 13px; color: #5d6368">Suggested. Matches your AMD graphics</span></span>
</label>
<label style="min-height: 48px; padding: 0 16px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<input type="radio" name="p" style="width: 18px; height: 18px; margin: 0; accent-color: #3daee9">
<span style="font: 500 14px 'Noto Sans Mono', monospace">vulkan-intel</span>
</label>
<label style="min-height: 48px; padding: 0 16px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<input type="radio" name="p" style="width: 18px; height: 18px; margin: 0; accent-color: #3daee9">
<span style="font: 500 14px 'Noto Sans Mono', monospace">nvidia-utils</span>
</label>
<label style="min-height: 48px; padding: 0 16px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<input type="radio" name="p" style="width: 18px; height: 18px; margin: 0; accent-color: #3daee9">
<span style="font: 500 14px 'Noto Sans Mono', monospace">vulkan-swrast</span>
</label>
</fieldset>
<span style="font: 400 12px/1.6 'Noto Sans Mono', monospace; color: #5d6368">pacman: there are 4 providers available for vulkan-driver</span>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #3daee9; color: #10161a; font: 600 16px 'Noto Sans', sans-serif">Continue</button>
<button type="button" style="height: 44px; border: 0; border-radius: 12px; background: transparent; color: #232629; font: 400 15px 'Noto Sans', sans-serif">Cancel the update</button>
</div>
</div>
</body>
</html>
